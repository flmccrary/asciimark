#homePanel>.dropdown,#homePanel>.command-group,#homePanel>label,#homePanel>input,#homePanel>button{align-self:center;margin-top:0;margin-bottom:0}

/* Telerik-inspired cool, bright product UI: crisp surfaces and violet-blue accents. */
:root{color-scheme:light;--bg:#f3f7ff;--panel:#ffffff;--ink:#172033;--muted:#65728a;--line:#dfe7f3;--accent:#6259d9;--toolbar:#ffffff;--soft:#f7f8ff;--shadow:0 8px 24px rgba(40,58,96,.08)}
body{background:var(--bg);color:var(--ink)}
.app-header{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(35,57,97,.05)}
.brand-mark{background:linear-gradient(135deg,#4ebc78,#6259d9);border-radius:8px;box-shadow:0 3px 8px rgba(98,89,217,.2)}
#ribbon{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(35,57,97,.05)}
.ribbon-tabs{background:#fff;border-bottom-color:var(--line);padding-inline:16px;gap:6px}
.ribbon-tab{color:#5b667b;border-radius:8px 8px 0 0;padding:9px 16px}
.ribbon-tab[aria-selected="true"]{color:var(--accent)}
.ribbon-tab[aria-selected="true"]:after{background:linear-gradient(90deg,#6259d9,#4386e8);height:3px;border-radius:3px 3px 0 0}
.ribbon-panel{background:linear-gradient(180deg,#fff 0%,#f8faff 100%);border:0}
.ribbon-panel button,.ribbon-panel .filebutton,.dropdown summary{background:#fff;border-color:#dfe6f2;color:var(--ink);border-radius:8px;box-shadow:0 1px 2px rgba(30,49,82,.04)}
.ribbon-panel button:hover,.ribbon-panel .filebutton:hover,.dropdown summary:hover{background:#f1f2ff;border-color:#c9c7fa;color:#5148c9}
.dropdown-menu{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(29,47,82,.16)}
.dropdown-menu button{background:transparent;border-color:transparent;box-shadow:none}
.dropdown-menu button:hover{background:#f1f2ff;color:#5148c9}
.wrap{background:var(--bg);padding:16px 18px;gap:14px}
.sidebar,.pane{background:var(--panel);border:1px solid #e0e8f4;border-radius:12px;box-shadow:var(--shadow)}
.sidebar h2,.pane h2{background:#fbfcff;border-bottom:1px solid #e9eef6;color:#68758b}
textarea{background:#fff;color:var(--ink)}
.preview iframe{background:#fff}
input[type=text]{background:#fff;border-color:#dbe4f1;border-radius:8px;color:var(--ink)}
.quick-access{border-right-color:#e5eaf3}
.quick-access button{border-radius:7px;color:#56627a}
.quick-access button:hover{background:#f1f2ff;border-color:#dfddff;color:#5148c9}
.toc-link:hover,.toc-link.active{background:#f0f2ff;color:#5148c9}
::-webkit-scrollbar-thumb{background:#ccd6e7;border:3px solid transparent;border-radius:9px;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:#aebcda}.theme-toggle{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;color:#59657b;cursor:pointer;flex:0 0 auto}
.theme-toggle:hover{background:#f1f2ff;border-color:#cfccff;color:#5148c9}
.theme-toggle svg{width:19px;height:19px;fill:currentColor}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111827;--panel:#1b2432;--ink:#e7edf7;--muted:#a6b2c4;--line:#3a465a;--accent:#9daaff;--toolbar:#172131;--soft:#242f42;--shadow:0 8px 24px rgba(0,0,0,.22)}
:root[data-theme="dark"] body,:root[data-theme="dark"] .wrap{background:var(--bg);color:var(--ink)}
:root[data-theme="dark"] .app-header,:root[data-theme="dark"] #ribbon,:root[data-theme="dark"] .ribbon-tabs{background:var(--panel);color:var(--ink);border-color:var(--line)}

:root[data-theme="dark"] .ribbon-panel button:hover,:root[data-theme="dark"] .ribbon-panel .filebutton:hover,:root[data-theme="dark"] .dropdown summary:hover,:root[data-theme="dark"] .theme-toggle:hover{background:#303d56;border-color:#6875b9;color:#c3caff}
:root[data-theme="dark"] .dropdown-menu{background:#202b3d;border-color:#46536a;box-shadow:0 12px 30px rgba(0,0,0,.4)}
:root[data-theme="dark"] .dropdown-menu button{background:transparent;border-color:transparent}
:root[data-theme="dark"] .dropdown-menu button:hover,:root[data-theme="dark"] .toc-link:hover,:root[data-theme="dark"] .toc-link.active{background:#303a56;color:#c3caff}
:root[data-theme="dark"] .sidebar,:root[data-theme="dark"] .pane{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
:root[data-theme="dark"] .sidebar h2,:root[data-theme="dark"] .pane h2{background:#1e2939;border-color:var(--line);color:var(--muted)}
:root[data-theme="dark"] textarea,:root[data-theme="dark"] input[type=text]{background:#151f2d;color:var(--ink);border-color:#46536a}
